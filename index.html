<!DOCTYPE html>
<html>
    <head>
        <title>WebXR IWER Stereo Demo</title>
        <script src="https://unpkg.com/iwer@latest/build/iwer.min.js"></script>
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        ></script>
        <style>
            body {
                margin: 0;
                overflow: hidden;
                background: transparent;
            }
            canvas {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <script>
            // Initialize IWER
            console.log("[index] Creating XRDevice...");
            const xrDevice = new IWER.XRDevice(
                IWER.metaQuest3,
                {
                    referenceSpaceType: "local-floor",
                },
            );
            xrDevice.installRuntime();
            console.log("[index] IWER runtime installed");

            // Configure stereo rendering
            xrDevice.stereoEnabled = true;
            xrDevice.ipd = 0.0068;

            // Three.js setup
            const scene = new THREE.Scene();
            const renderer = new THREE.WebGLRenderer({
                antialias: true,
                alpha: true,
            });

            renderer.xr.enabled = true;
            renderer.setClearColor(0x000000, 0);
            document.body.appendChild(renderer.domElement);

            // Create proper camera configuration
            const camera = new THREE.PerspectiveCamera();

            // Add lighting
            const light = new THREE.DirectionalLight(
                0xffffff,
                1,
            );
            light.position.set(1, 1, 1);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0x404040));

            // Add test object
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ff00,
            });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);
            cube.position.z = -2;
            cube.position.y = 2;

            let webxrBound = false;
            let webxrRetryTimer = null;

            function getWebXRHandle() {
                const ext = window.cefExt &&
                    window.cefExt.webxr;
                return ext || null;
            }

            function clearWebXRRetry() {
                if (webxrRetryTimer !== null) {
                    clearInterval(webxrRetryTimer);
                    webxrRetryTimer = null;
                }
            }

            function scheduleWebXRRetry() {
                if (webxrBound || webxrRetryTimer !== null) {
                    return;
                }
                webxrRetryTimer = setInterval(() => {
                    if (webxrBound) {
                        clearWebXRRetry();
                        return;
                    }
                    tryBindWebXRDevice("retry");
                }, 1000);
            }

            function tryBindWebXRDevice(label) {
                const handle = getWebXRHandle();
                if (
                    !handle ||
                    typeof handle.setDevice !== "function"
                ) {
                    if (label !== "retry") {
                        console.warn(
                            "[index] cefExt.webxr.setDevice unavailable",
                        );
                    }
                    return false;
                }
                try {
                    const bound = !!handle.setDevice(xrDevice);
                    if (bound) {
                        const wasInactive = !webxrBound;
                        webxrBound = true;
                        clearWebXRRetry();
                        if (wasInactive) {
                            const tag = label
                                ? " (" + label + ")"
                                : "";
                            console.log(
                                "[index] cefExt.webxr native pose push enabled" +
                                    tag,
                            );
                        }
                        return true;
                    }
                    if (!webxrBound && label !== "retry") {
                        console.warn(
                            "[index] cefExt.webxr.setDevice returned false",
                        );
                    }
                } catch (e) {
                    if (label !== "retry") {
                        console.warn(
                            "[index] cefExt.webxr.setDevice failed",
                            e,
                        );
                    }
                }
                return false;
            }

            if (!tryBindWebXRDevice("initial")) {
                scheduleWebXRRetry();
            }

            function xrRenderLoop(timestamp, frame) {
                renderer.render(scene, camera);
                cube.rotation.y += 0.0001;
            }

            async function startXrSession() {
                if (!navigator.xr) {
                    console.error("WebXR not supported!");
                    return;
                }
                if (
                    !await navigator.xr.isSessionSupported(
                        "immersive-vr",
                    )
                ) {
                    console.error(
                        "Immersive VR not supported!",
                    );
                    return;
                }

                if (
                    !webxrBound &&
                    !tryBindWebXRDevice("session")
                ) {
                    scheduleWebXRRetry();
                }

                try {
                    // In IWER, immersive-ar can start without user gesture; use it to auto-enter
                    const session = await navigator.xr
                        .requestSession("immersive-ar", {
                            requiredFeatures: ["local-floor"],
                        });
                    console.log("[index] XR session started");

                    session.addEventListener("end", () => {
                        console.log("[index] XR Session Ended");
                        renderer.setAnimationLoop(null);
                        const webxrWasActive = webxrBound;
                        const handle = getWebXRHandle();
                        if (
                            webxrWasActive && handle &&
                            typeof handle.clearDevice ===
                                "function"
                        ) {
                            try {
                                handle.clearDevice();
                            } catch (e) {
                                console.warn(
                                    "[index] cefExt.webxr.clearDevice failed",
                                    e,
                                );
                            }
                        }
                        webxrBound = false;
                        if (!webxrRetryTimer) {
                            scheduleWebXRRetry();
                        }
                    });

                    // Prefer an explicit XRWebGLLayer with antialias enabled
                    try {
                        const gl = renderer.getContext();
                        if (gl.makeXRCompatible) {
                            await gl.makeXRCompatible();
                        }
                        const baseLayer = new XRWebGLLayer(
                            session,
                            gl,
                            {
                                antialias: true,
                                alpha: false,
                                depth: false,
                                stencil: false,
                            },
                        );
                        session.updateRenderState({
                            baseLayer,
                        });
                    } catch (e) {
                        console.warn(
                            "XRWebGLLayer AA setup failed (falling back):",
                            e,
                        );
                    }

                    const maybePromise = renderer.xr.setSession(
                        session,
                    );
                    if (
                        maybePromise &&
                        typeof maybePromise.then === "function"
                    ) {
                        await maybePromise;
                    }
                    renderer.setAnimationLoop(xrRenderLoop);
                    console.log("[index] Animation loop set");
                } catch (err) {
                    console.error("XR session failed:", err);
                }
            }

            // Auto-start XR session after IWER installs the runtime
            Promise.resolve().then(() => startXrSession());

            renderer.render(scene, camera);
        </script>
    </body>
</html>
